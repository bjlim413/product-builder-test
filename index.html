<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S. 체크리스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-grid" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="topbar">
    <button class="logo" id="homeBtn" title="처음 화면으로">
      <span class="reactor"><span class="reactor-core"></span></span>
      <span class="logo-text">
        <strong>STARK CHECKLIST</strong>
        <small>J.A.R.V.I.S. MISSION SYSTEM</small>
      </span>
    </button>
    <nav class="breadcrumb" id="breadcrumb"></nav>
  </header>

  <main id="app"></main>

  <!-- 입력/수정 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <form class="modal-panel" id="modalForm">
      <h2 id="modalTitle">입력</h2>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>취소</button>
        <button type="submit" class="btn primary" id="modalSubmit">저장</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
